spring:
  application:
    name: bada

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          apple:
            client-id: ${APPLE_SERVICE_ID:apple-not-configured}   # Services ID (Bundle ID 아님)
            client-secret: generated-at-runtime                   # 실제 값은 AppleClientSecretGenerator가 ES256 JWT로 교체한다
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # 애플 콘솔 Return URL과 문자 단위로 같아야 하므로 프록시 헤더에 의존하지 않는 절대 URL로 고정한다.
            redirect-uri: "${app.server-url}/login/oauth2/code/apple"
            scope:
              - openid
              - name
              - email
            client-name: Apple

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          apple:
            # name/email scope를 요청하면 애플이 콜백을 form_post로 보낸다.
            authorization-uri: https://appleid.apple.com/auth/authorize?response_mode=form_post
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            # user-info-uri를 두지 않아야 OidcUserService가 UserInfo 호출을 건너뛰고 id_token만 쓴다.
            user-name-attribute: sub

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ADDRESS}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  openai:
    api-key: ${OPENAI-API-KEY}

aws:
  region: ap-northeast-2
  s3:
    bucket: ${BUCKET_NAME}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  server-url: ${SERVER_URL}

  oauth2:
    app-redirect-uri: ${APP_OAUTH_REDIRECT_URI}
    allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:}
    apple:
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      service-id: ${APPLE_SERVICE_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}     # .p8의 base64 본문 한 줄 (PEM 헤더 포함도 허용)

  ai:
    base-url: ${AI_BASE_URL}
    ws-base-url: ${AI_WS_BASE_URL}

  internal:
    secret: ${INTERNAL_SECRET}

  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:bada-23d9b}

server:
  forward-headers-strategy: framework
