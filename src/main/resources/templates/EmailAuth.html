<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <title>이메일 인증</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f8f4; font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;">

<div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
    바다 이메일 인증 코드입니다. 5분 안에 입력해 주세요.
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f8f4; padding:40px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px; background-color:#ffffff; border-radius:20px; overflow:hidden; box-shadow:0 6px 24px rgba(56,168,100,0.12);">

                <tr>
                    <td style="height:6px; background-color:#5ed67f; font-size:0; line-height:0;">&nbsp;</td>
                </tr>

                <tr>
                    <td align="center" style="padding:36px 24px 8px 24px;">
                        <div style="font-size:44px; line-height:1.1; font-weight:800; color:#5ed67f; letter-spacing:-1px;">
                            바다
                        </div>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:20px 32px 8px 32px;">
                        <h1 style="margin:0; font-size:22px; color:#14321f; font-weight:700;">이메일 인증 코드</h1>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:12px 32px 24px 32px;">
                        <p style="margin:0; font-size:14px; line-height:1.7; color:#5b7566;">
                            안녕하세요, 바다입니다.<br>
                            아래 <strong style="color:#14321f;">6자리 인증 코드</strong>를 인증 화면에 입력해 주세요.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:0 32px 8px 32px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#effaf2; border:1px solid #cdeed8; border-radius:14px;">
                            <tr>
                                <td align="center" style="padding:20px 36px;">
                                    <span th:text="${authNum}"
                                          style="font-size:34px; letter-spacing:9px; font-weight:700; color:#2fb45f; font-family:'Courier New',monospace;">
                                        000000
                                    </span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:18px 32px 8px 32px;">
                        <p style="margin:0; font-size:13px; color:#7b9186; line-height:1.7;">
                            인증 코드는 발송 시점부터 <strong style="color:#2fb45f;">5분 동안</strong> 유효합니다.<br>
                            시간이 지난 경우 인증 코드를 다시 요청해 주세요.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:26px 32px 0 32px;">
                        <hr style="border:none; border-top:1px solid #e6efe9; margin:0;">
                    </td>
                </tr>

                <tr>
                    <td style="padding:16px 32px 32px 32px;">
                        <p style="margin:0; font-size:12px; color:#a3b5aa; line-height:1.7;">
                            본 메일은 발신 전용입니다. 본인이 요청하지 않은 인증 메일이라면 무시하셔도 됩니다.<br>
                            계정 보안을 위해 인증 코드는 타인에게 공유하지 마세요.
                        </p>
                    </td>
                </tr>
            </table>

            <p style="margin:18px 0 0 0; font-size:11px; color:#a3b5aa;">
                © 바다 (ChickenMayoDeopbab). All rights reserved.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
