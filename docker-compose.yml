services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ehdus/bada:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-bada-23d9b}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_CREDENTIALS_PATH:-./src/main/resources/bada-firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      bada-net:
        aliases:
          - spring-app
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bada-net:
    external: true
