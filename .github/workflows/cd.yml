# =============================================================
# CD — Deployment (SSH + docker compose)
# Role: Deploy to the production server.
#       Runs ONLY after the CI workflow succeeds on main.
# =============================================================
name: CD

on:
  # Trigger after the "CI" workflow completes.
  # The job-level guard below ensures we deploy only on SUCCESS + main.
  workflow_run:
    workflows: [ "CI" ]
    types:
      - completed

# Prevent overlapping deployments
concurrency:
  group: cd-deploy-production
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------
  # CD JOB: Deploy to production over SSH
  # Guard: deploy only when CI succeeded AND the trigger was main.
  # -----------------------------------------------------------
  deploy:
    name: Deploy to Production (SSH)
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    environment: production

    steps:
      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose up -d --build
            docker image prune -f